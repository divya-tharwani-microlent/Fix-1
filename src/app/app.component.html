<div class="app-container">
  <!-- Sidebar -->
  <div *ngIf="isLoggedIn" [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }">

    <app-sidebar class="sidebar"></app-sidebar>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header" *ngIf="isLoggedIn">
      <nav class="navbar">
        <div class="container-xxl">
          <div class="d-flex align-items-center w-100">
            <div class=" d-flex align-items-center w-100 justify-content-end gap-2">
              <div class="dropdown user-profile ms-2 ms-sm-3 d-flex align-items-center">
                <a class="nav-link dropdown-toggle pulse p-0" href="#" role="button" data-bs-toggle="dropdown"
                  data-bs-display="static" aria-expanded="false">
                  <img class="avatar lg rounded-circle img-thumbnail" src="/assets/images/profile_av-BAILbt9C.svg"
                    alt="profile">
                </a>
                <div class="dropdown-menu rounded-lg shadow border-0 dropdown-animation dropdown-menu-end p-0 m-0">
                  <div class="card border-0 w280">
                    <div class="card-body pb-0">
                      <div class="d-flex py-1">
                        <img class="avatar rounded-circle" src="/assets/images/profile_av-BAILbt9C.svg" alt="profile">
                        <div class="flex-fill ms-3">
                          <p class="mb-0"><span class="font-weight-bold">{{userName}}</span></p>
                          <small class="">{{email}}</small><br>
                          <small>User ID : {{userID}}</small>
                        </div>
                      </div>
                      <div>
                        <hr class="dropdown-divider border-dark">
                      </div>
                    </div>
                    <div class="list-group m-2 ">
                      <a class="list-group-item list-group-item-action border-0" href="/profile">Profile Page</a>
                      <a class="list-group-item list-group-item-action border-0" (click)="logOut()">Signout</a>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Sidebar Toggle Button -->
              <button class="navbar-toggler" type="button" (click)="isSidebarCollapsed = !isSidebarCollapsed">
                <span class="fa fa-bars"></span>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </div>
    <div class="router-outlet-container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
